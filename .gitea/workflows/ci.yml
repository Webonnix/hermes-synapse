name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    container: python:3.11-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: apt-get update && apt-get install -y --no-install-recommends git gcc python3-dev && rm -rf /var/lib/apt/lists/*
      - name: Install python deps
        run: |
          pip install --no-cache-dir \
            "fastapi>=0.100.0" "uvicorn>=0.22.0" "python-telegram-bot>=20.3" \
            "httpx>=0.24.1" "python-dotenv>=1.0.0" "pydantic>=2.0" \
            "websockets>=11.0" "psutil>=5.9.0" "fastembed>=0.2.0" \
            "qdrant-client>=1.13.2" "matplotlib>=3.7.0" "docker>=6.1.0" \
            "pandas>=2.0.0" "openpyxl>=3.1.0" "beautifulsoup4>=4.12.0" \
            "python-multipart>=0.0.7" "google-auth>=2.20.0" \
            "google-auth-oauthlib>=1.0.0" "google-auth-httplib2>=0.2.0" \
            "google-api-python-client>=2.95.0" "todoist-api-python>=2.1.3" \
            "redis>=5.0.0" "matrix-nio>=0.24.0" \
            "pytest==8.3.5" "pytest-asyncio==0.25.3" "respx>=0.20"
      - name: Run backend tests
        env:
          PYTHONPATH: ${{ gitea.workspace }}
        run: |
          cd backend
          python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    container: node:20-alpine
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm test -- --run
      - name: Build
        working-directory: frontend
        run: npm run build
