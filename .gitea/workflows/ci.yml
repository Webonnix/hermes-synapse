name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    container: python:3.11-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: apt-get update && apt-get install -y --no-install-recommends git gcc python3-dev && rm -rf /var/lib/apt/lists/*
      # Dependencies come from backend/uv.lock only, so CI runs exactly the
      # versions the lockfile pins. A pyproject change without `uv lock`
      # fails here instead of silently testing something else.
      - name: Install uv
        run: pip install --no-cache-dir "uv==0.12.1"
      - name: Check the lockfile matches pyproject.toml
        working-directory: backend
        run: uv lock --check
      - name: Install python deps
        working-directory: backend
        run: uv sync --frozen --group dev
      - name: Run backend tests
        env:
          PYTHONPATH: ${{ gitea.workspace }}
        working-directory: backend
        run: uv run --frozen pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    # Debian, not alpine: vitest does not start on alpine (see AGENTS.md).
    container: node:20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
