x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vexa-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ${HERMES_ENV_FILE:-.env}
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-llamacpp}
      - LLM_API_BASE=${LLM_API_BASE:-https://openrouter.ai/api/v1}
      - LLAMACPP_BASE_URL=http://llama:8080
      - LLM_LOCK_PROVIDER_ENDPOINT=true
      - LLAMACPP_API_KEY=${LLAMACPP_API_KEY:-}
      - LOCAL_NUM_CTX=${LOCAL_NUM_CTX:-196608}
      - LOCAL_THINK=${LOCAL_THINK:-false}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - LLM_MODEL=${LLM_MODEL:-qwen3.8-27b}
      - QDRANT_HOST=qdrant
      - OBSIDIAN_HOST=host.docker.internal
      - PROJECT_WORKSPACE_ROOT=/workspace
      - PROJECT_MEMORY_AUTO_INDEX=${PROJECT_MEMORY_AUTO_INDEX:-true}
      - AUTONOMY_PROJECT_CONTEXT=${AUTONOMY_PROJECT_CONTEXT:-true}
      - AUTONOMY_INSTALL_ENABLED=${AUTONOMY_INSTALL_ENABLED:-false}
      - AUTONOMY_CAPABILITY_ROOT=/app/backend/data/capabilities
      - AUTONOMY_INSTALL_TIMEOUT_SECONDS=${AUTONOMY_INSTALL_TIMEOUT_SECONDS:-300}
      - VOICE_STT_ENABLED=${VOICE_STT_ENABLED:-true}
      - VOICE_STT_MODEL=${VOICE_STT_MODEL:-small}
      - VOICE_STT_DEVICE=${VOICE_STT_DEVICE:-cpu}
      - VOICE_STT_COMPUTE_TYPE=${VOICE_STT_COMPUTE_TYPE:-int8}
      - VOICE_STT_LANGUAGE=${VOICE_STT_LANGUAGE:-}
      - VOICE_STT_DOWNLOAD_ROOT=/app/backend/data/voice-models
      - VOICE_STT_PRELOAD=${VOICE_STT_PRELOAD:-true}
      - VOICE_TTS_ENABLED=${VOICE_TTS_ENABLED:-true}
      # "auto" tries the multilingual XTTS sidecar first, then Piper, then RHVoice.
      - VOICE_TTS_PROVIDER=${VOICE_TTS_PROVIDER:-auto}
      - VOICE_TTS_RHVOICE_BINARY=${VOICE_TTS_RHVOICE_BINARY:-RHVoice-test}
      - VOICE_TTS_VOICE=${VOICE_TTS_VOICE:-anna}
      - VOICE_TTS_VOICE_EN=${VOICE_TTS_VOICE_EN:-slt}
      - VOICE_TTS_XTTS_URL=${VOICE_TTS_XTTS_URL:-http://xtts:8700}
      - VOICE_TTS_XTTS_TIMEOUT_SECONDS=${VOICE_TTS_XTTS_TIMEOUT_SECONDS:-120}
      # backend/dev_sandbox.py talks to the Docker daemon (via the docker-proxy
      # sidecar below, never a raw socket — see its module docstring) to give
      # each parallel Kanban dev-run its own runner container, so bind-mount
      # sources must be HOST paths (this container's own /app/backend/data/...
      # view is not visible to the daemon). ${PWD} is this compose file's
      # directory (src/) at `docker compose up` time — override if you invoke
      # compose from somewhere else, or on a deployment whose backend/data
      # mount lives at a different host path (this is deliberately not derived
      # from a project-root guess, see dev_sandbox.py).
      - DEV_SANDBOX_HOST_RUNS_ROOT=${DEV_SANDBOX_HOST_RUNS_ROOT:-${PWD}/backend/data/dev-repo-runs}
      # backend/agent_runtimes/desktop.py: one gVisor desktop container per agent
      # (image built by the agent-desktop service below). Off unless enabled;
      # the host root is a HOST path for the same reason as the dev sandboxes.
      - AGENT_DESKTOPS_ENABLED=${AGENT_DESKTOPS_ENABLED:-false}
      - AGENT_DESKTOP_TOKEN_SECRET=${AGENT_DESKTOP_TOKEN_SECRET:-}
      - AGENT_DESKTOP_HOST_ROOT=${AGENT_DESKTOP_HOST_ROOT:-${PWD}/backend/data/agent-desktops}
      - AGENT_DESKTOP_RUNTIME=${AGENT_DESKTOP_RUNTIME:-runsc}
      - AGENT_DESKTOP_MAX_CONCURRENT=${AGENT_DESKTOP_MAX_CONCURRENT:-4}
      # OpenBot as a desktop kind (docs/agent-desktops-openbot.md) and OmniRoute
      # models for desktops — both off unless enabled.
      - OPENBOT_DESKTOPS_ENABLED=${OPENBOT_DESKTOPS_ENABLED:-false}
      - AGENT_LLM_EXTERNAL_ENABLED=${AGENT_LLM_EXTERNAL_ENABLED:-false}
      - AGENT_LLM_EXTERNAL_MODELS=${AGENT_LLM_EXTERNAL_MODELS:-*}
      - AGENT_LLM_EXTERNAL_DAILY_USD=${AGENT_LLM_EXTERNAL_DAILY_USD:-5}
      - AGENT_LLM_EXTERNAL_DAILY_REQUESTS=${AGENT_LLM_EXTERNAL_DAILY_REQUESTS:-500}
      - DEV_SANDBOX_MAX_CONCURRENT=${DEV_SANDBOX_MAX_CONCURRENT:-3}
      # Picked up automatically by docker.from_env() in dev_sandbox.py — routes
      # Docker API calls through the access-controlled proxy below instead of
      # a raw socket. No /var/run/docker.sock mount on this service, ever.
      - DOCKER_HOST=tcp://docker-proxy:2375
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app/backend
      - ./:/workspace:ro
      - ${HERMES_ENV_FILE:-.env}:/app/.env:ro
    depends_on:
      qdrant:
        condition: service_healthy
      llama:
        condition: service_healthy
      docker-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging: *default-logging
    networks:
      - hermes-net
      - dev-net
      - docker-proxy-net

  # Guards the real Docker socket: only this sidecar ever mounts it, and it
  # exposes just enough of the Docker API for backend/dev_sandbox.py to
  # create/start/stop/remove per-run containers — not exec into arbitrary
  # containers, not volumes/swarm/secrets/plugins/builds. Reachable only from
  # `backend`, on its own internal network; the dev-run sandboxes it manages
  # live on `dev-net` instead and can never reach this proxy, so an
  # agent-controlled `dev_exec` shell command inside a sandbox has no path to
  # the Docker API even if it tried.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    container_name: hermes-docker-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - INFO=1
      - VERSION=1
      - POST=1
      - EXEC=0
      - VOLUMES=0
      - BUILD=0
      - SWARM=0
      - SERVICES=0
      - TASKS=0
      - NODES=0
      - SECRETS=0
      - CONFIGS=0
      - PLUGINS=0
      - SYSTEM=0
      - DISTRIBUTION=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2375/version || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    networks:
      - docker-proxy-net

  dev-runner:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev-runner
    container_name: hermes-dev-runner
    restart: unless-stopped
    environment:
      - DEV_RUNNER_TOKEN=${DEV_RUNNER_TOKEN}
      - DEV_RUNNER_REPO_ROOT=/dev-repo
    volumes:
      - ./backend/data/dev-repo:/dev-repo
    mem_limit: 2g
    cpus: 2
    # dev-net: internal-only, the runner can talk to backend (and Gitea, when
    # the gitea service joins dev-net on the server compose). dev-egress-net:
    # the ONLY source of real internet access, added so `dev_exec` can run
    # `npm install`/`pip install`/etc. — before this, any goal needing a
    # package manager retried forever (DNS itself failed: EAI_AGAIN) with no
    # way to ever succeed. Kept as a second, separate bridge network rather
    # than just dropping dev-net's `internal: true` so egress doesn't also
    # mean reachability: dev-egress-net has no other member containers, so a
    # sandbox on it still cannot reach docker-proxy, llama, qdrant or
    # anything else internal — only the outside world and (via dev-net)
    # backend/Gitea. Per-run sandboxes inherit both automatically (see
    # dev_sandbox.py's _blocking_ensure_container, which mirrors whatever
    # networks this static container is on).
    networks:
      - dev-net
      - dev-egress-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8600/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging

  # Image of the per-agent desktops (agent_desktop/Dockerfile). Build-only: the
  # profile keeps `up` from ever starting it — backend/agent_runtimes/desktop.py
  # starts one container of this image per agent, under gVisor.
  #   docker compose build agent-desktop
  agent-desktop:
    build:
      context: .
      dockerfile: agent_desktop/Dockerfile
    image: hermes-agent-desktop:local
    profiles: ["build-only"]

  # OpenBot desktop image: the upstream OpenBot server image (pinned by digest in
  # openbot_desktop/Dockerfile) plus VNC, a terminal and the desktop bridge.
  #   docker compose build openbot-desktop
  openbot-desktop:
    build:
      context: .
      dockerfile: openbot_desktop/Dockerfile
    image: hermes-openbot-desktop:local
    profiles: ["build-only"]

  # One multilingual voice for Vexa: XTTS-v2 reads both Russian and English with
  # the same speaker, cloned on first boot from the Piper English voice below.
  # Deliberately not a backend dependency — if it is down or still loading its
  # weights, backend/tts.py falls back to Piper/RHVoice instead of blocking boot.
  xtts:
    build:
      context: .
      dockerfile: xtts/Dockerfile
    container_name: hermes-xtts
    restart: unless-stopped
    # Loopback only: the backend reaches it over hermes-net, the port is published
    # purely so /health and /speakers can be inspected from the host.
    ports:
      - "127.0.0.1:8700:8700"
    environment:
      - XTTS_DEVICE=${XTTS_DEVICE:-cuda}
      # Built-in studio speaker, used only when no Piper reference can be built.
      - XTTS_SPEAKER=${XTTS_SPEAKER:-Daisy Studious}
      - XTTS_SPEAKER_WAV=${XTTS_SPEAKER_WAV:-/speakers/vexa-reference.wav}
      - XTTS_REFERENCE_PIPER_MODEL=${XTTS_REFERENCE_PIPER_MODEL:-/piper-voices/en_US-amy-medium.onnx}
      - XTTS_DEFAULT_LANGUAGE=${XTTS_DEFAULT_LANGUAGE:-en}
      - CUDA_VISIBLE_DEVICES=${XTTS_CUDA_VISIBLE_DEVICES:-0}
      # XTTS-v2 weights are under the Coqui Public Model License (non-commercial);
      # the downloader refuses to run unattended without this acknowledgement.
      - COQUI_TOS_AGREED=${COQUI_TOS_AGREED:-1}
    volumes:
      - xtts_models:/models
      - xtts_speakers:/speakers
      - ./backend/data/piper-voices:/piper-voices:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging: *default-logging
    networks:
      - hermes-net

  # Browser sidecar: a headless-Chromium container serving two different
  # things behind one process.
  #   /run   — an LLM-driven browser-use Agent (browser_read/browser_task),
  #            interactive, open internet egress. Still gated at the
  #            application layer by BROWSER_AGENT_ENABLED (backend/tools.py
  #            refuses to call out even if this container is up) — set that
  #            explicitly to opt in, this compose entry alone does not.
  #   /audit — a deterministic, no-LLM render of a dev-run's own published
  #            demo (tools.dev_review_demo / dev_runs' verification gate).
  #            No egress needed and reaches nothing but its own read-only
  #            /previews mount below, so this half is on by default: a
  #            site-building dev-run cannot see what it built without it.
  # No `profiles:` gate — the /audit half is core to the Kanban site-review
  # loop, not an opt-in extra. If this host's memory ever gets tight, cap it
  # with `docker compose stop browser-runner` rather than removing it, since
  # that silently makes every site run finish unreviewed.
  browser-runner:
    build:
      context: .
      dockerfile: browser_runner/Dockerfile
    container_name: hermes-browser-runner
    restart: unless-stopped
    environment:
      - BROWSER_RUNNER_TOKEN=${BROWSER_RUNNER_TOKEN:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-llamacpp}
      - LLAMACPP_BASE_URL=http://llama:8080
      - LLM_API_BASE=${LLM_API_BASE:-https://openrouter.ai/api/v1}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-qwen3.8-27b}
      - AGENT_MODEL_BROWSER=${AGENT_MODEL_BROWSER:-}
      - BROWSER_AGENT_MAX_STEPS=${BROWSER_AGENT_MAX_STEPS:-25}
      - BROWSER_AGENT_TIMEOUT_SECONDS=${BROWSER_AGENT_TIMEOUT_SECONDS:-240}
      - AUDIT_TIMEOUT_SECONDS=${AUDIT_TIMEOUT_SECONDS:-120}
    volumes:
      # Same directory dev_publish_demo writes into and nginx's /demo/ serves
      # (see the frontend service below) — read-only, matches server.py's
      # DEV_PREVIEWS_ROOT default of /previews.
      - ./backend/data/dev-previews:/previews:ro
    mem_limit: 2g
    cpus: 2
    logging: *default-logging
    networks:
      - hermes-net

  # AI Router / token-saver sidecar: OmniRoute (github.com/diegosouzapw/omniroute,
  # a fork of 9Router with the same port, /app/data layout and dashboard API
  # paths; it replaced 9router on 2026-10-18). Fronts external LLM providers
  # with an OpenAI-compatible endpoint, tiered fallback and tool-output token
  # compression. Internal-only: the backend reaches it at
  # http://omniroute:20128/v1 via a normal provider_bindings entry
  # (Admin -> Providers); the redaction gateway in llm_client.py applies to
  # every call through it exactly like any other external
  # provider_type=openai_compatible binding. The `9router` alias keeps
  # bindings created before the switch (api_base http://9router:20128/v1)
  # working. OMNIROUTE_STORAGE_ENCRYPTION_KEY encrypts its DB; losing it means
  # re-connecting every provider account. Deliberately not a backend
  # dependency, same reasoning as xtts above.
  omniroute:
    image: diegosouzapw/omniroute:3.8.51@sha256:8bd462c9f60d8eda79329cfbb6ea7ea723505fe7721beb944f3d43835409e218
    container_name: hermes-omniroute
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      - PORT=20128
      - DASHBOARD_PORT=20128
      - DATA_DIR=/app/data
      - JWT_SECRET=${OMNIROUTE_JWT_SECRET:?Set OMNIROUTE_JWT_SECRET in .env}
      - API_KEY_SECRET=${OMNIROUTE_API_KEY_SECRET:?Set OMNIROUTE_API_KEY_SECRET in .env}
      - STORAGE_ENCRYPTION_KEY=${OMNIROUTE_STORAGE_ENCRYPTION_KEY:?Set OMNIROUTE_STORAGE_ENCRYPTION_KEY in .env}
      - STORAGE_ENCRYPTION_KEY_VERSION=v1
      - INITIAL_PASSWORD=${OMNIROUTE_INITIAL_PASSWORD:?Set OMNIROUTE_INITIAL_PASSWORD in .env}
      - BASE_URL=${ROUTER_PUBLIC_BASE_URL:-http://localhost:20128}
      - NEXT_PUBLIC_BASE_URL=${ROUTER_PUBLIC_BASE_URL:-http://localhost:20128}
      - NODE_OPTIONS=--max-old-space-size=2048
    ports:
      - "${ROUTER_PUBLISH_HOST:-127.0.0.1}:20128:20128"
    volumes:
      - omniroute_data:/app/data
    logging: *default-logging
    networks:
      hermes-net:
        aliases:
          - 9router

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Cache key for the service worker. Set HERMES_BUILD_ID in the deploy
        # (e.g. the commit sha) for a traceable one; unset just means the plugin
        # uses a build timestamp, which still changes on every build.
        HERMES_BUILD_ID: ${HERMES_BUILD_ID:-}
    container_name: vexa-dashboard
    restart: unless-stopped
    environment:
      # Must always be set — see docker-compose.yml (root) for why an unset
      # var here is a hard nginx config parse error, not a soft failure.
      - ROUTER_HOSTNAME=${ROUTER_HOSTNAME:-router.invalid}
      - LLM_PROXY_TOKEN=${LLM_PROXY_TOKEN:-}
    ports:
      - "9119:80"
    volumes:
      # Kanban dev-run demo previews (see nginx.conf.template's /demo/ location).
      # Backend writes here via dev_publish_demo; nginx only ever reads.
      - ./backend/data/dev-previews:/usr/share/nginx/dev-previews:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging
    networks:
      - hermes-net

  qdrant:
    image: qdrant/qdrant:v1.18.1@sha256:45f8e3ddc2570a4d029877e1b5ec1045c19b3852b4e22a55c7f43b05aea0ca89
    container_name: vexa-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    networks:
      - hermes-net

  # Local LLM server: upstream llama.cpp with tensor-split across the GPUs and
  # the model's MTP draft head (see docs/inference-engine-evaluation-2026-09-13.md
  # and deploy/docker-compose.hermes-only.yml for the production twin). Put the
  # GGUF files under ${LLAMA_MODELS_DIR:-./models}/qwen3.8-27b/.
  llama:
    image: ghcr.io/ggml-org/llama.cpp@sha256:6ac921528d613deb0fd142c654735e594a446a1c37a069eeab08d8fd974d4bec
    container_name: hermes-llama
    restart: unless-stopped
    # NCCL (tensor-split all-reduce over PCIe) needs real shared memory; with
    # the default 64 MiB /dev/shm it aborts at the first decode with
    # "unhandled system error". The bake-off ran with --ipc=host.
    ipc: host
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${LLAMA_MODELS_DIR:-./models}:/models:ro
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --model
      - /models/qwen3.8-27b/Qwen3.8-27B-UD-Q4_K_M.gguf
      - --mmproj
      - /models/qwen3.8-27b/mmproj.gguf
      - --alias
      - qwen3.8-27b
      - --ctx-size
      - "${LLAMA_CTX_SIZE:-196608}"
      - --parallel
      - "1"
      - --flash-attn
      - "on"
      - --batch-size
      - "1024"
      - --ubatch-size
      - "1024"
      - --split-mode
      - tensor
      - --cache-type-k
      - f16
      - --cache-type-v
      - f16
      - --spec-type
      - draft-mtp
      - --spec-draft-model
      - /models/qwen3.8-27b/mtp-draft.gguf
      - --spec-draft-n-max
      - "4"
      - --spec-draft-backend-sampling
      - --jinja
      - --reasoning-format
      - deepseek
      - --metrics
      - --no-webui
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    logging: *default-logging
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - hermes-net

networks:
  hermes-net:
    driver: bridge
  dev-net:
    driver: bridge
    internal: true
  # backend <-> docker-proxy only. Deliberately never shared with dev-net —
  # see docker-proxy's service comment for why that separation matters.
  docker-proxy-net:
    driver: bridge
    internal: true
  # Real internet egress for dev-runner sandboxes ONLY (npm/pip/apt package
  # registries) — no other service ever joins this network, so it grants
  # reachability to the outside world and nothing else. See dev-runner's own
  # service comment above for why this exists alongside, not instead of, the
  # internal-only dev-net.
  dev-egress-net:
    driver: bridge

volumes:
  qdrant_data:
  xtts_models:
  xtts_speakers:
  omniroute_data:
