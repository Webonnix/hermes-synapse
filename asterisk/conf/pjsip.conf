; Hermes: PJSIP transport. Provider trunks are generated by the backend into
; @STATE@/pjsip_trunks.conf and reloaded over ARI (module reload res_pjsip.so).

[global]
type=global
user_agent=Hermes
endpoint_identifier_order=ip,username,anonymous

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16
;@EXTERNAL@

#include @STATE@/pjsip_trunks.conf
