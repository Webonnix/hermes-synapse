; Hermes dialplan. Every provider call goes straight into the "hermes" ARI
; application; the backend decides everything else (rules, who answers, transfer).

[general]
static=yes
writeprotect=yes

[hermes-inbound]
; The dialled number (DID) arrives as the extension on most trunks; some send
; the trunk login instead, so the To header is passed along as well.
exten => _[+0-9a-zA-Z].,1,NoOp(Hermes inbound ${EXTEN} from ${CALLERID(num)})
 same => n,Stasis(hermes,inbound,${EXTEN},${PJSIP_HEADER(read,To)})
 same => n,Hangup()

exten => s,1,NoOp(Hermes inbound (no DID) from ${CALLERID(num)})
 same => n,Stasis(hermes,inbound,s,${PJSIP_HEADER(read,To)})
 same => n,Hangup()

[hermes-selftest]
; Used by the backend's self-test and the local integration test: a Local channel
; whose far half plays a prompt, so audio flows through ARI + AudioSocket without
; any provider or number.
exten => play,1,Answer()
 same => n,Playback(demo-congrats)
 same => n,Wait(20)
 same => n,Hangup()
