name: Signed release images
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    uses: ./.github/workflows/test.yml
  source-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39
      - run: uv sync --frozen --project backend --group dev
      - name: Reject secrets, workflow drift and dependency advisories
        env:
          PROJECT_WORKSPACE_ROOT: ${{ github.workspace }}
          PYTHONPATH: ${{ github.workspace }}
          PYTHON_DOTENV_DISABLED: '1'
        run: backend/.venv/bin/python ops/security_gate.py --dependencies
  publish:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [tests, source-policy]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: backend/Dockerfile
            context: .
          - name: frontend
            dockerfile: frontend/Dockerfile
            context: frontend
          - name: launcher
            dockerfile: sandbox_launcher/Dockerfile
            context: .
          - name: dev-runner
            dockerfile: backend/Dockerfile.dev-runner
            context: .
          - name: agent-desktop
            dockerfile: agent_desktop/Dockerfile
            context: .
          - name: browser-runner
            dockerfile: browser_runner/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Name this commit's image
        env:
          REPOSITORY: ${{ github.repository }}
          COMPONENT: ${{ matrix.name }}
        run: echo "IMAGE=ghcr.io/${REPOSITORY,,}/${COMPONENT}:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build once; scan and publish the same image
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          CONTEXT: ${{ matrix.context }}
        run: docker build --build-arg HERMES_BUILD_ID="$GITHUB_SHA" -t "$IMAGE" -f "$DOCKERFILE" "$CONTEXT"
      - uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2
        with:
          image: ${{ env.IMAGE }}
          fail-build: true
          severity-cutoff: high
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ env.IMAGE }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: release-sbom-${{ matrix.name }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
      - name: Publish, sign and attest immutable digest
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          digest="$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')"
          test -n "$digest"
          cosign sign --yes "$digest"
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson "$digest"
          printf '%s\n' "$digest" > release-digest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-digest-${{ matrix.name }}
          path: release-digest.txt
